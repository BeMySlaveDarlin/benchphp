version: '3.8'

services:
  php:
    build:
      context: ./docker/php
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - postgres
    env_file:
      - .env
    command: tail -f /dev/null

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DB_PORT}:5432"
    env_file:
      - .env
